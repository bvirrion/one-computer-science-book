line-length = 88
target-version = "py312"
[lint]
select = ["E", "F", "W", "B", "UP"]
# zip(strict=) is noise in a school listing
ignore = ["B905"]
[lint.per-file-ignores]
"**/tests/*.py" = ["E501"]
# the shared tools are never printed
"code/shared/**" = ["E501"]
# Listings printed in the books may teach a pattern ruff would rewrite (a staged
# bug, an older idiom shown to be replaced). Mark such a line with `# noqa: <code>`
# and say why in the chapter, or list the file here with the rule and a reason.
# Book 1 staged lessons, printed from line 1 (so no tooling comment may sit in the file):
"code/grade-6/01-first-python-program/listings/typo.py" = ["F821"]  # the misspelt print is the lesson
"code/grade-6/02-variables-and-input/listings/kinds.py" = ["UP003"]  # the type of a literal value is the lesson
"code/grade-7/01-functions/listings/local.py" = ["F821"]  # the name used outside its function is the lesson
# Book 2, grade 11 toy-machine project: the shared package is imported after the sys.path change that
# the chapter explains (printed from line 1, so no tooling comment may sit on the import).
"code/grade-11/10-project-toy-machine/listings/run_m5.py" = ["E402"]
"code/grade-11/10-project-toy-machine/listings/compare_shared.py" = ["E402"]
"code/grade-11/10-project-toy-machine/listings/ours_tests.py" = ["E402"]
